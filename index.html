const $=id=>document.getElementById(id);let chapter=4,idx=-1,selected=-1,checked=false,results=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function home(){idx=-1;results=[];$('app').innerHTML=`<h1>Patient Care Practice Exam</h1><p class="muted">Interactive practice for radiography students. Answers and explanations appear immediately after each question.</p><div class="group"><label for="chapter">Choose chapter</label><select id="chapter"><option value="4">Chapter 4 — Health-Care Delivery System</option><option value="5">Chapter 5 — Professional Roles &amp; Behaviors</option></select></div><div class="group"><label>Available exam length</label><p>25 verified questions per chapter</p><div class="note">The question bank currently contains 25 distinct questions per chapter. Longer 50/75/100/150-question exams will be added after additional questions are authored and checked. No duplicate questions are used to inflate the count.</div></div><button class="primary" id="start">Start 25-Question Exam →</button>`;$('chapter').value=chapter;$('chapter').onchange=e=>chapter=+e.target.value;$('start').onclick=()=>{idx=0;selected=-1;checked=false;question()}}function question(){let q=raw[chapter][idx],opts=q.slice(1,5).filter(x=>x!==null),score=results.filter(r=>r.correct).length;let dropdown=q[2]!==null&&idx%3===1;$('app').innerHTML=`<div class="row"><strong>Chapter ${chapter} · Question ${idx+1} / 25</strong><span class="muted">Correct: ${score}</span></div><div class="bar"><div class="fill" style="width:${100*(idx+(checked?1:0))/25}%"></div></div><p class="muted small">${esc(q[7])} · ${q[2]===null?'True / False':dropdown?'Dropdown':'Multiple Choice'}</p><h2>${esc(q[0])}</h2><div id="choices">${dropdown?`<select id="choice"><option value="">Choose your answer</option>${opts.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('')}</select>`:opts.map((o,i)=>`<button class="option" data-n="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback"></div><div class="row" style="margin-top:24px"><button class="secondary" id="exit">Exit exam</button><button class="primary" id="action" disabled>Check answer</button></div>`;$('exit').onclick=()=>{if(confirm('Exit this exam? Your current attempt will be reset.'))home()};if(dropdown){$('choice').onchange=e=>{selected=e.target.value===''?-1:+e.target.value;$('action').disabled=selected<0}}else document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=+b.dataset.n;document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));$('action').disabled=false});$('action').onclick=()=>{if(!checked){checked=true;results.push({q,chosen:selected,correct:selected===q[5]});let opts=q.slice(1,5).filter(x=>x!==null);$('feedback').innerHTML=`<div class="feedback ${selected===q[5]?'good':'bad'}"><strong>${selected===q[5]?'✓ Correct!':'✕ Incorrect'}</strong><p><b>Correct answer:</b> ${esc(opts[q[5]])}</p><p>${esc(q[6])}</p></div>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true);if($('choice'))$('choice').disabled=true;$('action').textContent=idx===24?'View results →':'Next question →';$('action').disabled=false;document.querySelector('.fill').style.width=`${100*(idx+1)/25}%`}else{idx++;selected=-1;checked=false;if(idx===25)finish();else question()}}}function finish(){let score=results.filter(r=>r.correct).length;let missed=results.filter(r=>!r.correct);let topics={};for(let r of missed)topics[r.q[7]]=(topics[r.q[7]]||0)+1;$('app').innerHTML=`<h1>Exam complete!</h1><p class="muted">Chapter ${chapter} · 25 questions</p><div class="result">${score}/25 · ${Math.round(score/25*100)}%</div><h2>Areas to review</h2><p>${Object.entries(topics).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} (${v} missed)`).join(' · ')||'Excellent — no incorrect answers!'}</p><h2>Review missed questions</h2>${missed.map(r=>{let opts=r.q.slice(1,5).filter(x=>x!==null);return `<div class="review"><strong>${esc(r.q[0])}</strong><p class="small">Your answer: ${esc(opts[r.chosen])}<br>Correct answer: ${esc(opts[r.q[5]])}</p><p class="muted small">${esc(r.q[6])}</p></div>`}).join('')}<button class="primary" id="again">Return to exam home</button>`;$('again').onclick=home}home();
