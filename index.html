const $=id=>document.getElementById(id);let mode='67',count=25,bank=[],idx=-1,selected=-1,checked=false,results=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function home(){idx=-1;results=[];$('app').innerHTML=`<h1>Patient Care: Chapters 6 &amp; 7 Practice Exam</h1><p class="muted">Choose your chapters and exam length. Every question is unique within an attempt.</p><div class="group"><label for="mode">Choose chapters</label><select id="mode"><option value="6">Chapter 6 only</option><option value="7">Chapter 7 only</option><option value="67">Chapters 6 &amp; 7 mixed</option></select></div><div class="group"><label for="count">Number of questions</label><select id="count"></select></div><p class="note">Questions are drawn randomly from a larger bank of distinct concepts. Based on the professor’s lecture: select an individual chapter or a mixed Chapters 6 and 7 practice exam. Questions are shuffled each attempt.</p><button class="primary" id="start">Start exam →</button>`;$('mode').value=mode;function lengths(){let available=mode==='67'?raw[6].length+raw[7].length:raw[+mode].length;let choices=[10,15,20,25,30,50,75,100].filter(n=>n<=available);if(!choices.length)choices=[available];if(!choices.includes(count))count=choices[0];$('count').innerHTML=choices.map(n=>`<option value="${n}">${n} questions</option>`).join('');$('count').value=count}$('mode').onchange=e=>{mode=e.target.value;lengths()};$('count').onchange=e=>count=+e.target.value;lengths();$('start').onclick=()=>{bank=mode==='67'?shuffle([...shuffle(raw[6]).slice(0,Math.min(Math.ceil(count/2),raw[6].length)),...shuffle(raw[7]).slice(0,Math.min(Math.floor(count/2),raw[7].length))]):shuffle(raw[+mode]).slice(0,count);idx=0;selected=-1;checked=false;question()}}function question(){let q=bank[idx],opts=q.slice(1,5).filter(x=>x!==null),score=results.filter(r=>r.correct).length,dropdown=q[2]!==null&&idx%3===1;$('app').innerHTML=`<div class="row"><strong>Chapter ${q.chapter} · Question ${idx+1} / ${bank.length}</strong><span class="muted">Correct: ${score}</span></div><div class="bar"><div class="fill" style="width:${100*(idx+(checked?1:0))/bank.length}%"></div></div><p class="muted small">${esc(q[7])} · ${q[2]===null?'True / False':dropdown?'Dropdown':'Multiple Choice'}</p><h2>${esc(q[0])}</h2><div id="choices">${dropdown?`<select id="choice"><option value="">Choose your answer</option>${opts.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('')}</select>`:opts.map((o,i)=>`<button class="option" data-n="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback"></div><div class="row" style="margin-top:24px"><button class="secondary" id="exit">Exit exam</button><button class="primary" id="action" disabled>Check answer</button></div>`;$('exit').onclick=()=>{if(confirm('Exit this exam? Your current attempt will be reset.'))home()};if(dropdown){$('choice').onchange=e=>{selected=e.target.value===''?-1:+e.target.value;$('action').disabled=selected<0}}else document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=+b.dataset.n;document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));$('action').disabled=false});$('action').onclick=()=>{if(!checked){checked=true;results.push({q,chosen:selected,correct:selected===q[5]});$('feedback').innerHTML=`<div class="feedback ${selected===q[5]?'good':'bad'}"><strong>${selected===q[5]?'✓ Correct!':'✕ Incorrect'}</strong><p><b>Correct answer:</b> ${esc(opts[q[5]])}</p><p>${esc(q[6])}</p></div>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true);if($('choice'))$('choice').disabled=true;$('action').textContent=idx===bank.length-1?'View results →':'Next question →';$('action').disabled=false;document.querySelector('.fill').style.width=`${100*(idx+1)/bank.length}%`}else{idx++;selected=-1;checked=false;if(idx===bank.length)finish();else question()}}}function finish(){let score=results.filter(r=>r.correct).length,missed=results.filter(r=>!r.correct),topics={};for(let r of missed)topics[r.q[7]]=(topics[r.q[7]]||0)+1;$('app').innerHTML=`<h1>Exam complete!</h1><p class="muted">${mode==='67'?'Chapters 6 & 7 mixed':'Chapter '+mode} · ${bank.length} questions</p><div class="result">${score}/${bank.length} · ${Math.round(score/bank.length*100)}%</div><h2>Areas to review</h2><p>${Object.entries(topics).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} (${v} missed)`).join(' · ')||'Excellent — no incorrect answers!'}</p><h2>Review missed questions</h2>${missed.map(r=>{let opts=r.q.slice(1,5).filter(x=>x!==null);return `<div class="review"><strong>Chapter ${r.q.chapter}: ${esc(r.q[0])}</strong><p class="small">Your answer: ${esc(opts[r.chosen])}<br>Correct answer: ${esc(opts[r.q[5]])}</p><p class="muted small">${esc(r.q[6])}</p></div>`}).join('')}<button class="primary" id="again">Return to exam home</button>`;$('again').onclick=home}raw[4]=raw[4].map(q=>Object.assign(q,{chapter:4}));raw[5]=raw[5].map(q=>Object.assign(q,{chapter:5}));raw[6]=raw[6].map(q=>Object.assign(q,{chapter:6}));raw[7]=raw[7].map(q=>Object.assign(q,{chapter:7}));home();
