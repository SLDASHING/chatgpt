const $=id=>document.getElementById(id);let mode='both',count=25,bank=[],idx=-1,selected=-1,checked=false,results=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function home(){idx=-1;results=[];$('app').innerHTML=`<h1>Patient Care Practice Exam</h1><p class="muted">Choose your chapters and exam length. Every question is unique within an attempt.</p><div class="group"><label for="mode">Choose chapters</label><select id="mode"><option value="4">Chapter 4 only</option><option value="5">Chapter 5 only</option><option value="both">Chapters 4 &amp; 5 mixed</option></select></div><div class="group"><label for="count">Number of questions</label><select id="count"></select></div><p class="note">Single-chapter exams have 25 or 50 questions. Mixed exams have 25, 50, 75 or 100 questions. Questions are shuffled for each attempt.</p><button class="primary" id="start">Start exam →</button>`;$('mode').value=mode;function lengths(){let choices=mode==='both'?[25,50,75,100]:[25,50];if(!choices.includes(count))count=25;$('count').innerHTML=choices.map(n=>`<option value="${n}">${n} questions</option>`).join('');$('count').value=count}$('mode').onchange=e=>{mode=e.target.value;lengths()};$('count').onchange=e=>count=+e.target.value;lengths();$('start').onclick=()=>{bank=mode==='both'?shuffle([...shuffle(raw[4]).slice(0,count/2===Math.floor(count/2)?count/2:Math.ceil(count/2)),...shuffle(raw[5]).slice(0,Math.floor(count/2))]):shuffle(raw[+mode]).slice(0,count);idx=0;selected=-1;checked=false;question()}}function question(){let q=bank[idx],opts=q.slice(1,5).filter(x=>x!==null),score=results.filter(r=>r.correct).length,dropdown=q[2]!==null&&idx%3===1;$('app').innerHTML=`<div class="row"><strong>Chapter ${q.chapter} · Question ${idx+1} / ${bank.length}</strong><span class="muted">Correct: ${score}</span></div><div class="bar"><div class="fill" style="width:${100*(idx+(checked?1:0))/bank.length}%"></div></div><p class="muted small">${esc(q[7])} · ${q[2]===null?'True / False':dropdown?'Dropdown':'Multiple Choice'}</p><h2>${esc(q[0])}</h2><div id="choices">${dropdown?`<select id="choice"><option value="">Choose your answer</option>${opts.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('')}</select>`:opts.map((o,i)=>`<button class="option" data-n="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback"></div><div class="row" style="margin-top:24px"><button class="secondary" id="exit">Exit exam</button><button class="primary" id="action" disabled>Check answer</button></div>`;$('exit').onclick=()=>{if(confirm('Exit this exam? Your current attempt will be reset.'))home()};if(dropdown){$('choice').onchange=e=>{selected=e.target.value===''?-1:+e.target.value;$('action').disabled=selected<0}}else document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=+b.dataset.n;document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));$('action').disabled=false});$('action').onclick=()=>{if(!checked){checked=true;results.push({q,chosen:selected,correct:selected===q[5]});$('feedback').innerHTML=`<div class="feedback ${selected===q[5]?'good':'bad'}"><strong>${selected===q[5]?'✓ Correct!':'✕ Incorrect'}</strong><p><b>Correct answer:</b> ${esc(opts[q[5]])}</p><p>${esc(q[6])}</p></div>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true);if($('choice'))$('choice').disabled=true;$('action').textContent=idx===bank.length-1?'View results →':'Next question →';$('action').disabled=false;document.querySelector('.fill').style.width=`${100*(idx+1)/bank.length}%`}else{idx++;selected=-1;checked=false;if(idx===bank.length)finish();else question()}}}function finish(){let score=results.filter(r=>r.correct).length,missed=results.filter(r=>!r.correct),topics={};for(let r of missed)topics[r.q[7]]
