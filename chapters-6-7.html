const $=id=>document.getElementById(id);let mode='67',count=25,bank=[],idx=-1,selected=-1,checked=false,results=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function randomizeAnswers(q){const a=q.slice(1,5).filter(x=>x!==null);if(a.length!==4){const copy=[...q];copy.chapter=q.chapter;return copy;}const order=shuffle([0,1,2,3]);const correct=order.indexOf(q[5]);const copy=[q[0],...order.map(i=>a[i]),correct,q[6],q[7]];copy.chapter=q.chapter;return copy}

d?1:0))/bank.length}%"></div></div><p class="muted small">${esc(q[7])} · ${q[2]===null?'True / False':dropdown?'Dropdown':'Multiple Choice'}</p><h2>${esc(q[0])}</h2><div id="choices">${dropdown?`<select id="choice"><option value="">Choose your answer</option>${opts.map((o,i)=>`<option value="${i}">${esc(o)}</option>`).join('')}</select>`:opts.map((o,i)=>`<button class="option" data-n="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback"></div><div class="row" style="margin-top:24px"><button class="secondary" id="exit">Exit exam</button><button class="primary" id="action" disabled>Check answer</button></div>`;$('exit').onclick=()=>{if(confirm('Exit this exam? Your current attempt will be reset.'))home()};if(dropdown){$('choice').onchange=e=>{selected=e.target.value===''?-1:+e.target.value;$('action').disabled=selected<0}}else document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=+b.dataset.n;document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));$('action').disabled=false});$('action').onclick=()=>{if(!checked){checked=true;results.push({q,chosen:selected,correct:selected===q[5]});$('feedback').innerHTML=`<div class="feedback ${selected===q[5]?'good':'bad'}"><strong>${selected===q[5]?'✓ Correct!':'✕ Incorrect'}</strong><p><b>Correct answer:</b> ${esc(opts[q[5]])}</p><p>${esc(q[6])}</p></div>`;document.querySelectorAll('.option').forEach(b=>b.disabled=true);if($('choice'))$('choice').disabled=true;$('action').textContent=idx===bank.length-1?'View results →':'Next question →';$('action').disabled=false;document.querySelector('.fill').style.width=`${100*(idx+1)/bank.length}%`}else{idx++;selected=-1;checked=false;if(idx===bank.length)finish();else question()}}}function finish(){let score=results.filter(r=>r.correct).length,missed=results.filter(r=>!r.correct),topics={};for(let r of missed)topics[r.q[7]]=(topics[r.q[7]]||0)+1;$('app').innerHTML=`<h1>Exam complete!</h1><p class="muted">$
