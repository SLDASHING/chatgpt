"type":"tf"},{"ch":10,"source":"Original True/False — chapter-derived","q":"Hand hygiene is necessary even when gloves have been worn.","options":["True","False"],"correct":0,"ex":"This statement is true according to the infection-control concepts in the supplied chapter materials.","type":"tf"},{"ch":10,"source":"Original True/False — chapter-derived","q":"An epidemic and a pandemic are identical in geographic scope.","options":["True","False"],"correct":1,"ex":"This statement is false according to the infection-control concepts in the supplied chapter materials.","type":"tf"},{"ch":10,"source":"Original True/False — chapter-derived","q":"MRSA and VRE are both examples of antimicrobial-resistant organisms.","options":["True","False"],"correct":0,"ex":"This statement is true according to the infection-control concepts in the supplied chapter materials.","type":"tf"},{"ch":9,"source":"Additional original — chapter-derived","q":"Select ALL six required links in the cycle of infection.","options":["Infectious organism","Reservoir","Portal of exit","Means of transmission","Portal of entry","Susceptible host","Radiographic exposure"],"correct":[0,1,2,3,4,5],"ex":"The six links are agent, reservoir, exit, transmission, entry, and susceptible host.","type":"multi"},{"ch":10,"source":"Additional original — chapter-derived","q":"Select ALL responsibilities of a hospital infection-control department.","options":["Monitor and track infections","Develop infection-control policies","Use CDC recommendations","Replace radiographers during every exam"],"correct":[0,1,2],"ex":"The department monitors infections and develops prevention policies using authoritative guidance.","type":"multi"},{"ch":10,"source":"Additional original — chapter-derived","q":"Select ALL examples of Standard Precautions practices.","options":["Hand hygiene","Appropriate gloves when exposure is anticipated","Safe sharps disposal","Reusing contaminated gloves between patients"],"correct":[0,1,2],"ex":"Standard Precautions include hand hygiene, exposure-based PPE, and safe sharps handling.","type":"multi"}];
const total=DATA.length;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let bank=[],idx=0,answers=[],picked=[],checked=false,mode='both';
const el=document.getElementById('app');
function counts(ch){return DATA.filter(q=>ch==='both'||q.ch===Number(ch)).length}
function home(){const opts=['both',9,10].map(k=>`<option value="${k}">${k==='both'?'Chapters 9 & 10 — Mixed':`Chapter ${k} only`} (${counts(k)} questions)</option>`).join('');el.innerHTML=`<section class="card"><h2>Choose your exam</h2><p class="muted">Questions from your graded quiz, study guide, PowerPoint quizzes, key terms, and original chapter-based practice. No repeated question within an attempt.</p><div class="controls"><div class="field"><label for="mode">Chapter selection</label><select id="mode">${opts}</select></div><div class="field"><label for="length">Exam length</label><select id="length"></select></div></div><p class="muted" id="availability"></p><div class="btnrow"><button class="btn" onclick="start()">Start practice exam</button></div></section><section class="card"><h2>What is included?</h2><div id="summary"></div><p class="muted">Select-all questions use checkboxes. The correct answer and explanation appear after you press Check Answer.</p><p class="muted">The 10 HEIC screenshots in the uploaded ZIP could not be reliably decoded here, so their unverified text has not been represented as verbatim questions in this version.</p></section>`;document.getElementById('mode').onchange=lengths;lengths();const count={};DATA.forEach(q=>count[q.source]=(count[q.source]||0)+1);document.getElementById('summary').innerHTML=Object.entries(count).map(([k,v])=>`<span class="pill">${esc(k)}: ${v}</span>`).join('')}
function lengths(){let m=document.getElementById('mode').value,max=counts(m),length=document.getElementById('length');length.innerHTML=[10,15,20,25,30,40,50,75,100,150,200,250].filter(n=>n<=max).map(n=>`<option value="${n}">${n} questions</option>`).join('')+`<option value="${max}">All ${max} available</option>`;document.getElementById('availability').textContent=`${max} unique questions available for this selection.`}
function randomize(q){let c={...q,options:[...q.options],correct:q.correct};if(q.type==='mc'){let ids=shuffle([0,1,2,3]);c.options=ids.map(i=>q.options[i]);c.correct=ids.indexOf(q.correct)}else if(q.type==='multi'){let ids=shuffle(q.options.map((_,i)=>i));c.options=ids.map(i=>q.options[i]);c.correct=ids.map((orig,i)=>q.correct.includes(orig)?i:-1).filter(i=>i>=0)}return c}
function start(){mode=document.getElementById('mode').value;let count=Number(document.getElementById('length').value),arr=DATA.filter(q=>mode==='both'||q.ch===Number(mode));if(mode==='both'){let a=shuffle(arr.filter(q=>q.ch===9)),b=shuffle(arr.filter(q=>q.ch===10));let na=Math.min(a.length,Math.ceil(count/2)),nb=Math.min(b.length,count-na);let combined=[...a.slice(0,na),...b.slice(0,nb)];if(combined.length<count){let used=new Set(combined);combined.push(...shuffle(arr.filter(q=>!used.has(q))).slice(0,count-combined.length))}arr=combined}else arr=shuffle(arr).slice(0,count);bank=shuffle(arr).map(randomize);idx=0;answers=[];picked=[];checked=false;render()}
function select(i){if(checked)return;const q=bank[idx];if(q.type==='multi'){picked=picked.includes(i)?picked.filter(x=>x!==i):[...picked,i]}else picked=[i];render()}
function isRight(q,a){return q.type==='multi'?JSON.stringify([...a].sort((x,y)=>x-y))===JSON.stringify([...q.correct].sort((x,y)=>x-y)):a.length===1&&a[0]===q.correct}
function check(){if(!picked.length)return;const q=bank[idx];answers[idx]={selected:[...picked],ok:isRight(q,picked)};checked=true;render()}
function next(){idx++;picked=[];checked=false;if(idx===bank.length)results();else render()}
function render(){const q=bank[idx],answer=answers[idx],correct=answer?.ok;const score=answers.filter(a=>a?.ok).length;let options=q.options.map((o,i)=>{const selected=picked.includes(i),right=q.type==='multi'?q.correct.includes(i):q.correct===i;const state=checked?(right?' correct':selected?' wrong':''):selected?' selected':'';const symbol=q.type==='multi'?(selected?'☑':'☐'):`${String.fromCharCode(65+i)}.`;return `<button class="choice${state}" ${checked?'disabled':''} onclick="select(${i})">${symbol} ${esc(o)}</button>`}).join('');const rightAnswer=q.type==='multi'?q.correct.map(i=>q.options[i]).join('; '):q.options[q.correct];el.innerHTML=`<section class="card"><div><span class="pill">Chapter ${q.ch}</span><span class="pill">${esc(q.source)}</span><span class="pill">${q.type==='tf'?'True / False':q.type==='multi'?'Select all that apply':'Multiple choice'}</span></div><p class="muted">Question ${idx+1} of ${bank.length} · Correct so far: ${score}</p><div class="bar"><div class="fill" style="width:${100*(idx+1)/bank.length}%"></div></div><h2 style="white-space:pre-wrap;margin-top:22px">${esc(q.q)}</h2>${q.type==='multi'?'<p class="muted">Select every correct answer. More than one answer may be correct.</p>':''}<div class="choices">${options}</div>${checked?`<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'✓ Correct!':'✕ Incorrect'}</strong><p><b>Correct answer:</b> ${esc(rightAnswer)}</p><p>${esc(q.ex)}</p></div>`:''}<div class="btnrow">${checked?'<button class="btn" onclick="next()">'+(idx===bank.length-1?'See results':'Next question')+'</button>':'<button class="btn" onclick="check()" '+(!picked.length?'disabled':'')+'>Check Answer</button>'}<button class="btn secondary" onclick="if(confirm('Leave this attempt?'))home()">Exam home</button></div></section>`}
function results(){let correct=answers.filter(x=>x.ok).length,percent=Math.round(correct/bank.length*100),missed=bank.map((q,i)=>({...q,answer:answers[i]})).filter(x=>!x.answer.ok);let review=missed.map((q,i)=>{let your=q.answer.selected.map(j=>q.options[j]).join('; '),right=q.type==='multi'?q.correct.map(j=>q.options[j]).join('; '):q.options[q.correct];return `<div class="review"><span class="pill">Chapter ${q.ch}</span><p><b>${i+1}. ${esc(q.q)}</b></p><p><b>Your answer:</b> ${esc(your)}</p><p><b>Correct:</b> ${esc(right)}</p><p class="muted">${esc(q.ex)}</p></div>`}).join('');el.innerHTML=`<section class="card"><h2>Exam completed</h2><div class="stats"><div class="stat"><strong>${percent}%</strong>Grade</div><div class="stat"><strong>${correct}</strong>Correct</div><div class="stat"><strong>${missed.length}</strong>Incorrect</div></div><div class="btnrow"><button class="btn" onclick="home()">Return to exam home</button><button class="btn secondary" onclick="startAgain()">Try again</button></div></section><section class="card"><h2>Review missed questions (${missed.length})</h2>${review||'<p>Excellent — no missed questions.</p>'}</section>`}
function startAgain(){const selected=mode;home();document.getElementById('mode').value=selected;lengths();start()}
home();
</script></body></html>
